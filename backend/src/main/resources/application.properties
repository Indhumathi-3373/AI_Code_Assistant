# Spring Application Configuration
server.port=8080

# Swagger OpenAPI UI Configuration paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAI Configuration
# Binds to system environment variable OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini
openai.api.allowed-models=${OPENAI_ALLOWED_MODELS:gpt-4o-mini,gpt-4o,gpt-3.5-turbo}
openai.api.fallback-models=${OPENAI_FALLBACK_MODELS:gpt-4o}
openai.api.json-mode-models=${OPENAI_JSON_MODE_MODELS:gpt-4o-mini,gpt-4o,gpt-3.5-turbo}
nvidia.api.url=${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
nvidia.api.allowed-models=${NVIDIA_ALLOWED_MODELS:openai/gpt-oss-20b,qwen/qwen3-next-80b-a3b-instruct}

# Allow longer generations from hosted inference providers such as NVIDIA NIM.
ai.http.connect-timeout-ms=${AI_HTTP_CONNECT_TIMEOUT_MS:10000}
ai.http.read-timeout-ms=${AI_HTTP_READ_TIMEOUT_MS:180000}

# RestTemplate DEBUG output includes request bodies, which can contain user prompts.
logging.level.org.springframework.web.client.RestTemplate=WARN
logging.level.org.springframework.web.HttpLogging=WARN

# Embedded H2 database used by default so the app starts without any setup.
# Set SPRING_PROFILES_ACTIVE=postgres to use a local PostgreSQL database.
spring.datasource.url=jdbc:h2:file:./data/codementordb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret (needs to be 256-bit / 64 characters hex)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXM=}
jwt.expirationMs=86400000

# The supplied UI has no sign-in screen yet. Keep its chat and history usable
# during local development; set SECURITY_REQUIRE_AUTH=true when the client sends JWTs.
security.require-auth=${SECURITY_REQUIRE_AUTH:false}
